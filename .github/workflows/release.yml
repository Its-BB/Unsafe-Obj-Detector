name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build standalone executable
        run: python -m PyInstaller droneai.spec --noconfirm --clean

      - name: Package release zip
        shell: pwsh
        run: |
          Copy-Item -Force config.example.yaml dist/droneai-security/
          Copy-Item -Force README.md dist/droneai-security/README.txt
          Copy-Item -Force LICENSE dist/droneai-security/
          foreach ($w in @("weapon_detection_custom.pt", "yolov8n.pt")) {
            if (Test-Path $w) { Copy-Item -Force $w dist/droneai-security/ }
          }
          Compress-Archive -Path dist/droneai-security -DestinationPath dist/droneai-security-windows.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/droneai-security-windows.zip
          generate_release_notes: true

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Upload sdist to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
